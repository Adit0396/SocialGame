services:
  # Backend API
  - type: web
    name: sportmeet-api
    env: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  # Frontend Static Site
  - type: web
    name: sportmeet-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    # ⬇️ ADD THIS SECTION - SPA ROUTING FIX
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # ⬆️ END OF NEW SECTION
    envVars:
      - key: VITE_GOOGLE_MAPS_API_KEY
        sync: false
      - key: VITE_API_URL
        value: https://socialgame-api.onrender.com/api